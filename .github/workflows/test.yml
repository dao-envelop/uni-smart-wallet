name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned deliberately. The toolchain floats otherwise, and a minor bump has already changed test
      # semantics under us: forge 1.8 gives each top-level call from a test its own transient storage
      # (as a real transaction does) where 1.7 leaked it between them, turning four passing
      # per-transaction tests red without a line of contract code changing. Upgrading should be a commit
      # someone makes and verifies, not something a build discovers.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.8.1"

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # Does the stack on the chains still carry every function master has? Selector presence in
      # the runtime at each deployments/<chainId>.json address, over public RPCs (task_049). Red
      # means the chain is BEHIND master — a deploy is due or [Unreleased] must say why not. It
      # cannot prove equality, only catch growth master made that the chain never received, which
      # is exactly the 47-day gap of 2026-07/09 nobody saw. Public RPCs blink: a failure here with
      # "eth_getCode failed" is the network, not the stack, and exits 2 rather than 1.
      - name: Deployed stack carries every selector of this build
        run: node script/probe/probe_deployment.mjs

