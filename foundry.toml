[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
solc_version = '0.8.26'
evm_version = "cancun"
optimizer_runs = 200
via_ir = false
ffi = true

# The deploy script reads ./script/chain_params.json at runtime; tests write
# temporary chain-config fixtures under ./test/ to exercise loadConfig.
fs_permissions = [
    { access = "read", path = "./script" },
    { access = "read-write", path = "./test" },
    { access = "read-write", path = "./deployments" },
]

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[etherscan]
arbitrum = { key = "${ETHERSCAN_TOKEN}" }
bnb_smart_chain = { key = "${BSCSCAN_TOKEN}" }
mainnet = { key = "${ETHERSCAN_TOKEN}" }
optimism = { key = "${API_KEY_OPTIMISTIC_ETHERSCAN}" }
polygon = { key = "${POLYGONSCAN_TOKEN}" }
sepolia = { key = "${ETHERSCAN_TOKEN}" }
unichain = { key = "${ETHERSCAN_TOKEN}" }
unichain-sepolia = { key = "${ETHERSCAN_TOKEN}" }
base = { key = "${ETHERSCAN_TOKEN}" }

[rpc_endpoints]
arbitrum = "https://burned-hardworking-dust.arbitrum-mainnet.quiknode.pro/${WEB3_QUICKNODE_ARB}/"
localhost = "http://localhost:8545"
mainnet = "${ENVELOP_MAINNET}"
#base = "https://base-mainnet.core.chainstack.com/${CHAIN_STACK_ID}"
base = "https://cool-dark-emerald.base-mainnet.quiknode.pro/${WEB3_QUICKNODE_BASE}/"
unichain = "https://falling-spring-energy.unichain-mainnet.quiknode.pro/${WEB3_QUICKNODE_UNI}/"
unichain-sepolia = "https://skilled-proud-wildflower.unichain-sepolia.quiknode.pro/${WEB3_QUICKNODE_UNI_SEP}/"
